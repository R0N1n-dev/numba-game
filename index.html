<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type the Number</title>
<style>
  :root {
    --sky-top: #8ed8f8;
    --sky-bot: #d9f2ff;
    --hill-far: #a9dd8b;
    --hill-near: #7cc65f;
    --sun: #ffd965;
    --cloud: #ffffff;
    --numeral: rgba(255,255,255,.55);
    --card: #fffdf8;
    --ink: #2a2622;
    --muted: #7d746b;
    --line: #ecdfcb;
    --field: #fff;
    --hit: #1f7a4d;
    --miss: #c8543f;
    --fur: #e8883f;
    --fur-dark: #c96c2c;
    --fur-light: #fbe7d2;
    --shadow: rgba(66,84,40,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-top: #1b2450;
      --sky-bot: #38406e;
      --hill-far: #2b4a3c;
      --hill-near: #1d3a2e;
      --sun: #f3e2a8;
      --cloud: #5a628e;
      --numeral: rgba(255,255,255,.14);
      --card: #191d28;
      --ink: #f0ece5;
      --muted: #97918a;
      --line: #2e3442;
      --field: #222736;
      --hit: #5fd39a;
      --miss: #e5836f;
      --fur-dark: #b75f25;
      --fur-light: #f6dcc3;
      --shadow: rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", ui-sans-serif, system-ui, Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 62%, var(--sky-bot) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    overflow-x: hidden;
  }

  /* ---------- scenery ---------- */
  .scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .sun {
    position: absolute; top: 6%; right: 9%;
    width: 110px; height: 110px; border-radius: 50%;
    background: var(--sun);
    box-shadow: 0 0 0 22px color-mix(in srgb, var(--sun) 32%, transparent);
  }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42vh; }
  .cloud {
    position: absolute;
    background: var(--cloud);
    border-radius: 999px;
    opacity: .92;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .c1 { width: 150px; height: 44px; top: 14%; left: -190px; animation-duration: 78s; }
  .c1::before { width: 62px; height: 62px; top: -26px; left: 24px; }
  .c1::after  { width: 46px; height: 46px; top: -18px; left: 78px; }
  .c2 { width: 110px; height: 34px; top: 34%; left: -150px; animation-duration: 112s; animation-delay: -30s; opacity: .8; }
  .c2::before { width: 48px; height: 48px; top: -20px; left: 18px; }
  .c2::after  { width: 36px; height: 36px; top: -13px; left: 58px; }
  .c3 { width: 180px; height: 50px; top: 55%; left: -230px; animation-duration: 150s; animation-delay: -70s; opacity: .55; }
  .c3::before { width: 72px; height: 72px; top: -30px; left: 30px; }
  .c3::after  { width: 54px; height: 54px; top: -22px; left: 96px; }
  @keyframes drift { to { transform: translateX(calc(100vw + 260px)); } }

  .digit {
    position: absolute;
    color: var(--numeral);
    font-weight: 700;
    line-height: 1;
    animation: bob ease-in-out infinite alternate;
    user-select: none;
  }
  @keyframes bob { to { transform: translateY(-16px) rotate(6deg); } }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .digit { animation: none; }
    .c1 { left: 8%; } .c2 { left: 52%; } .c3 { left: 76%; }
  }

  /* ---------- card ---------- */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 30rem;
    text-align: center;
    background: var(--card);
    border-radius: 28px;
    padding: 1.75rem 1.5rem 1.5rem;
    box-shadow: 0 18px 40px var(--shadow);
  }

  /* ---------- critter ---------- */
  .friend { width: 140px; height: 122px; margin: 0 auto 0.25rem; display: block; overflow: visible; }
  .friend .body { transform-origin: 74px 120px; }
  .friend .ear-l { transform-origin: 48px 44px; }
  .friend .ear-r { transform-origin: 100px 44px; }
  .friend .eye-happy, .friend .mouth-cheer, .friend .spark { opacity: 0; }
  .friend.cheer .body { animation: hop 620ms cubic-bezier(.3,.9,.4,1); }
  .friend.cheer .ear-l { animation: wiggle-l 620ms ease; }
  .friend.cheer .ear-r { animation: wiggle-r 620ms ease; }
  .friend.cheer .eye-open { opacity: 0; }
  .friend.cheer .eye-happy { opacity: 1; }
  .friend.cheer .mouth-idle { opacity: 0; }
  .friend.cheer .mouth-cheer { opacity: 1; }
  .friend.cheer .spark { animation: pop 620ms ease-out; }
  .friend.oops .body { animation: shake 320ms ease; }

  @keyframes hop {
    0%   { transform: translateY(0) scale(1,1); }
    18%  { transform: translateY(4px) scale(1.08,.9); }
    45%  { transform: translateY(-26px) scale(.95,1.07); }
    72%  { transform: translateY(0) scale(1.06,.94); }
    100% { transform: translateY(0) scale(1,1); }
  }
  @keyframes wiggle-l { 0%,100% { transform: rotate(0); } 40% { transform: rotate(-16deg); } 70% { transform: rotate(6deg); } }
  @keyframes wiggle-r { 0%,100% { transform: rotate(0); } 40% { transform: rotate(16deg); } 70% { transform: rotate(-6deg); } }
  @keyframes pop { 0% { opacity:0; transform: scale(.4); } 35% { opacity:1; transform: scale(1.1); } 100% { opacity:0; transform: scale(1.35); } }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) {
    .friend.cheer .body, .friend.cheer .ear-l, .friend.cheer .ear-r, .friend.oops .body { animation: none; }
    .friend.cheer .spark { animation: none; opacity: 1; }
  }

  .target {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(3.25rem, 17vw, 6rem);
    letter-spacing: 0.06em;
    line-height: 1;
    margin: 0 0 1.25rem;
    transition: color 120ms linear;
  }
  .target.hit { color: var(--hit); }
  .target.miss { color: var(--miss); }

  input {
    width: 100%;
    background: var(--field);
    border: 2px solid var(--line);
    border-radius: 14px;
    color: inherit;
    font: inherit;
    font-size: 1.75rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
    text-align: center;
    padding: 0.7rem 1rem;
    outline-offset: 3px;
  }
  input:focus-visible { outline: 3px solid var(--fur); }
  .hint { color: var(--muted); font-size: 0.95rem; margin: 0.75rem 0 0; min-height: 1.2em; }

  .stats {
    display: flex; justify-content: center; gap: 2.25rem;
    margin-top: 1.75rem; padding-top: 1.25rem;
    border-top: 2px dashed var(--line);
  }
  .stats div { display: flex; flex-direction: column; gap: 0.2rem; }
  .stats b { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); font-size: 0.8rem; }

  .lengths { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.45rem; margin-top: 1.4rem; }
  .lengths button {
    background: none;
    border: 2px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.35rem 0.85rem;
  }
  .lengths button[aria-pressed="true"] { border-color: var(--fur); color: var(--fur-dark); }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <span class="digit" style="left:6%;  top:22%; font-size:76px; animation-duration:7s;">7</span>
  <span class="digit" style="left:18%; top:64%; font-size:52px; animation-duration:9s;">3</span>
  <span class="digit" style="left:84%; top:46%; font-size:64px; animation-duration:8s;">5</span>
  <span class="digit" style="left:72%; top:76%; font-size:44px; animation-duration:11s;">9</span>
  <span class="digit" style="left:44%; top:8%;  font-size:40px; animation-duration:10s;">2</span>
  <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
    <path fill="var(--hill-far)" d="M0 190 q180 -90 360 -10 q180 80 360 -20 q180 -100 360 -10 q180 90 360 20 V320 H0Z"/>
    <path fill="var(--hill-near)" d="M0 250 q200 -70 400 0 q200 70 380 -10 q220 -90 460 10 q120 50 200 40 V320 H0Z"/>
  </svg>
</div>

<main>
  <svg class="friend" id="friend" viewBox="0 0 148 128" role="img" aria-hidden="true">
    <g class="spark" fill="none" stroke="var(--fur-dark)" stroke-width="4" stroke-linecap="round">
      <path d="M22 44 L12 38"/><path d="M26 28 L20 18"/><path d="M42 20 L40 9"/>
      <path d="M126 44 L136 38"/><path d="M122 28 L128 18"/><path d="M106 20 L108 9"/>
    </g>
    <g class="body">
      <path d="M104 106 q30 6 26 -22 q-3 16 -24 12z" fill="var(--fur-dark)"/>
      <g class="ear-l"><path d="M40 60 L44 22 L66 42z" fill="var(--fur)"/>
        <path d="M46 52 L48 33 L59 44z" fill="var(--fur-light)"/></g>
      <g class="ear-r"><path d="M108 60 L104 22 L82 42z" fill="var(--fur)"/>
        <path d="M102 52 L100 33 L89 44z" fill="var(--fur-light)"/></g>
      <path d="M74 36 c26 0 36 18 36 36 c0 26 -16 44 -36 44 c-20 0 -36 -18 -36 -44 c0 -18 10 -36 36 -36z" fill="var(--fur)"/>
      <path d="M74 74 c14 0 20 10 20 20 c0 12 -9 20 -20 20 c-11 0 -20 -8 -20 -20 c0 -10 6 -20 20 -20z" fill="var(--fur-light)"/>
      <g class="eye-open" fill="#24292b"><circle cx="59" cy="69" r="6"/><circle cx="89" cy="69" r="6"/></g>
      <g class="eye-happy" fill="none" stroke="#24292b" stroke-width="4" stroke-linecap="round">
        <path d="M52 71 q7 -10 14 0"/><path d="M82 71 q7 -10 14 0"/></g>
      <ellipse cx="74" cy="88" rx="7" ry="5.5" fill="#24292b"/>
      <path class="mouth-idle" d="M74 93 v4 M74 97 q-7 5 -12 0 M74 97 q7 5 12 0"
            fill="none" stroke="#24292b" stroke-width="3" stroke-linecap="round"/>
      <path class="mouth-cheer" d="M63 97 q11 14 22 0 q-11 5 -22 0z" fill="#24292b"/>
      <circle cx="50" cy="86" r="5" fill="#f2a9a0" opacity=".65"/>
      <circle cx="98" cy="86" r="5" fill="#f2a9a0" opacity=".65"/>
    </g>
  </svg>

  <p class="target" id="target" aria-live="polite">000</p>
  <input id="entry" type="text" inputmode="numeric" autocomplete="off" autocorrect="off"
         spellcheck="false" aria-label="Type the number shown above">
  <p class="hint" id="hint">Type the number. Get it right and Pip jumps.</p>

  <div class="stats">
    <div><b id="streak">0</b><span>streak</span></div>
    <div><b id="best">0</b><span>best</span></div>
    <div><b id="total">0</b><span>solved</span></div>
  </div>

  <div class="lengths" id="lengths" role="group" aria-label="Number length">
    <button type="button" data-len="1">1 digit</button>
    <button type="button" data-len="2">2 digits</button>
    <button type="button" data-len="3">3 digits</button>
    <button type="button" data-len="4">4 digits</button>
    <button type="button" data-len="5">5 digits</button>
  </div>
</main>

<script>
(function () {
  var targetEl = document.getElementById('target');
  var entry = document.getElementById('entry');
  var hint = document.getElementById('hint');
  var friend = document.getElementById('friend');
  var streakEl = document.getElementById('streak');
  var bestEl = document.getElementById('best');
  var totalEl = document.getElementById('total');
  var lengths = document.getElementById('lengths');

  var cheers = ['Nice one.', 'Got it.', 'Pip is pleased.', 'Keep going.', 'That was quick.'];
  var state = { len: 3, current: '', streak: 0, best: 0, total: 0 };
  var timer = null;

  function load() {
    try {
      var raw = localStorage.getItem('number-game');
      if (raw) {
        var s = JSON.parse(raw);
        state.best = s.best || 0;
        state.total = s.total || 0;
        state.len = s.len || 3;
      }
    } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem('number-game', JSON.stringify({
        best: state.best, total: state.total, len: state.len
      }));
    } catch (e) {}
  }

  function newNumber() {
    var n = '';
    for (var i = 0; i < state.len; i++) n += Math.floor(Math.random() * 10);
    if (state.len > 1 && n === state.current) return newNumber();
    state.current = n;
    targetEl.textContent = n;
  }

  function render() {
    streakEl.textContent = state.streak;
    bestEl.textContent = state.best;
    totalEl.textContent = state.total;
  }

  function react(good) {
    clearTimeout(timer);
    friend.classList.remove('cheer', 'oops');
    targetEl.classList.remove('hit', 'miss');
    void friend.offsetWidth;
    friend.classList.add(good ? 'cheer' : 'oops');
    targetEl.classList.add(good ? 'hit' : 'miss');
    timer = setTimeout(function () {
      friend.classList.remove('cheer', 'oops');
      targetEl.classList.remove('hit', 'miss');
    }, good ? 900 : 400);
  }

  entry.addEventListener('input', function () {
    var val = entry.value.replace(/\D/g, '');
    entry.value = val;
    if (val.length < state.current.length) return;

    if (val === state.current) {
      state.streak++;
      state.total++;
      if (state.streak > state.best) state.best = state.streak;
      hint.textContent = cheers[Math.floor(Math.random() * cheers.length)];
      react(true);
      newNumber();
    } else {
      state.streak = 0;
      hint.textContent = 'Not quite. Same number, try again.';
      react(false);
    }
    entry.value = '';
    render();
    save();
  });

  lengths.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    state.len = Number(btn.dataset.len);
    state.streak = 0;
    entry.value = '';
    hint.textContent = state.len === 1 ? 'One digit now.' : state.len + ' digits now.';
    setLengthButtons();
    newNumber();
    render();
    save();
    entry.focus();
  });

  function setLengthButtons() {
    Array.prototype.forEach.call(lengths.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', Number(b.dataset.len) === state.len);
    });
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest('button')) entry.focus();
  });

  load();
  setLengthButtons();
  newNumber();
  render();
  entry.focus();
})();
</script>
</body>
</html>
